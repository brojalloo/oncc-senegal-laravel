name: Image Docker

# Construit l'image et l'exécute réellement contre PostgreSQL, puis vérifie le
# comportement du conteneur. Sans cela, le Dockerfile, supervisord et nginx ne
# seraient jamais exécutés avant un déploiement : la suite de tests PHP ne dit
# rien de l'image.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oncc
          POSTGRES_USER: oncc
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncc -d oncc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t oncc:ci .

      - name: Vérifier que le CSS compilé contient les classes de pagination
        run: |
          # Ces classes viennent des vues de pagination de Laravel, atteintes
          # par @source. Si la phase assets ne les voit pas, Tailwind les
          # supprime et la pagination s'affiche sans style.
          docker run --rm oncc:ci sh -c 'cat public/build/assets/*.css' > /tmp/app.css
          for c in rounded-l-md rounded-r-md; do
            grep -q "$c" /tmp/app.css || { echo "::error::classe .$c absente du CSS compilé"; exit 1; }
          done
          echo "Classes de pagination présentes."

      - name: Vérifier qu'aucun secret n'est embarqué dans l'image
        run: |
          # .env et bootstrap/cache/config.php contiennent APP_KEY et les mots
          # de passe : ils ne doivent jamais entrer dans une couche.
          if docker run --rm oncc:ci sh -c 'test -f .env'; then
            echo "::error::un fichier .env a été copié dans l'image"; exit 1
          fi
          if docker run --rm oncc:ci sh -c 'test -f bootstrap/cache/config.php'; then
            echo "::error::une configuration mise en cache a été copiée dans l'image"; exit 1
          fi
          echo "Aucun secret embarqué."

      - name: Démarrer le conteneur
        run: |
          APP_KEY=$(docker run --rm oncc:ci php artisan key:generate --show --no-ansi)
          echo "::add-mask::$APP_KEY"

          docker run -d --name oncc --network host \
            -e APP_KEY="$APP_KEY" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_URL=http://localhost:8080 \
            -e PORT=8080 \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_DATABASE=oncc \
            -e DB_USERNAME=oncc \
            -e DB_PASSWORD=secret \
            -e SESSION_DRIVER=database \
            -e CACHE_STORE=database \
            -e QUEUE_CONNECTION=database \
            -e MAIL_MAILER=log \
            oncc:ci

      - name: Attendre que l'application réponde
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/up >/dev/null 2>&1; then
              echo "Application prête après ${i} tentative(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::l'application n'a jamais répondu"
          docker logs oncc
          exit 1

      - name: Journal de démarrage
        run: docker logs oncc

      - name: Les trois processus sont-ils supervisés ?
        run: |
          # nginx, php-fpm et le worker de file d'attente. Sans ce dernier,
          # aucun email ne part et les messages s'empilent en base.
          for p in nginx php-fpm 'queue:work'; do
            docker exec oncc sh -c "ps -o args | grep -v grep | grep -q -- '$p'" \
              || { echo "::error::processus absent : $p"; docker exec oncc ps -o args; exit 1; }
            echo "présent : $p"
          done

      - name: Les journaux sont-ils inscriptibles par www-data ?
        run: |
          # Les commandes de démarrage tournent en root : si les droits sont
          # posés au mauvais moment, php-fpm ne peut plus journaliser et
          # l'application se tait sans erreur visible.
          docker exec oncc sh -c 'test -w storage/logs || exit 1'
          owner=$(docker exec oncc stat -c '%U' storage/logs)
          echo "storage/logs appartient à : $owner"
          [ "$owner" = "www-data" ] || { echo "::error::storage/logs appartient à $owner"; exit 1; }
          docker exec oncc su -s /bin/sh www-data -c 'echo test >> storage/logs/laravel.log' \
            || { echo "::error::www-data ne peut pas écrire dans le journal"; exit 1; }
          echo "www-data peut écrire."

      - name: Les migrations ont-elles tourné dans PostgreSQL ?
        run: |
          tables=$(docker exec oncc php artisan db:table users --no-ansi 2>&1 || true)
          echo "$tables" | head -5
          docker exec oncc php artisan migrate:status --no-ansi | tail -5

      - name: Aucune donnée de démonstration en production
        run: |
          # Le seeder doit refuser de s'exécuter : ses comptes ont des
          # identifiants publiés.
          count=$(docker exec oncc php artisan tinker --execute='echo App\Models\User::count();' 2>/dev/null | tr -dc '0-9')
          echo "utilisateurs en base : ${count:-0}"
          [ "${count:-0}" = "0" ] || { echo "::error::la base contient des comptes semés"; exit 1; }

      - name: En-têtes de sécurité
        run: |
          headers=$(curl -sI http://127.0.0.1:8080/login)
          echo "$headers"
          for h in "content-security-policy" "x-frame-options" "x-content-type-options" "referrer-policy"; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::en-tête manquant : $h"; exit 1; }
          done
          echo "$headers" | grep -qi "^x-powered-by:" && { echo "::error::X-Powered-By exposé"; exit 1; }
          echo "Tous les en-têtes attendus sont présents."

      - name: HSTS derrière un répartiteur TLS
        run: |
          # Cas réel du déploiement : la plateforme termine le TLS et transmet
          # X-Forwarded-Proto. Sans TrustProxies, HSTS ne serait jamais émis.
          curl -sI -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/login \
            | grep -qi '^strict-transport-security:' \
            || { echo "::error::HSTS absent derrière un répartiteur"; exit 1; }
          echo "HSTS émis."

      - name: Pages d'erreur personnalisées
        run: |
          body=$(curl -s http://127.0.0.1:8080/adresse-inexistante)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/adresse-inexistante)
          [ "$code" = "404" ] || { echo "::error::code $code au lieu de 404"; exit 1; }
          echo "$body" | grep -q "Page introuvable" \
            || { echo "::error::page d'erreur brute de Laravel au lieu de la page personnalisée"; exit 1; }
          echo "Page 404 personnalisée servie."

      - name: Limitation des tentatives de connexion
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/login \
              -H 'Accept: application/json' -d 'email=a@b.sn&password=x')
          done
          [ "$code" = "429" ] || { echo "::error::la 6e tentative renvoie $code, pas 429"; exit 1; }
          echo "Limitation active."

      - name: La file d'attente traite réellement un travail
        run: |
          docker exec oncc php artisan tinker --execute="App\Jobs\SendNewsletter::dispatch('CI','<p>test</p>','all');" >/dev/null 2>&1
          for i in $(seq 1 20); do
            pending=$(docker exec oncc php artisan tinker --execute='echo DB::table("jobs")->count();' 2>/dev/null | tr -dc '0-9')
            [ "${pending:-1}" = "0" ] && { echo "Travail consommé par le worker."; exit 0; }
            sleep 3
          done
          echo "::error::le travail n'a jamais été consommé — le worker ne tourne pas"
          docker logs oncc | tail -30
          exit 1

      - name: Les données survivent-elles au redémarrage ?
        run: |
          # Le défaut d'origine : SQLite dans le conteneur, tout disparaissait
          # à chaque redéploiement.
          docker exec oncc php artisan tinker --execute="App\Models\User::create(['email'=>'persist@test.sn','password'=>bcrypt('x'),'nom'=>'T','prenom'=>'T','role'=>'public','statut'=>'actif']);" >/dev/null 2>&1
          docker restart oncc
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/up >/dev/null 2>&1 && break
            sleep 3
          done
          found=$(docker exec oncc php artisan tinker --execute="echo App\Models\User::where('email','persist@test.sn')->count();" 2>/dev/null | tr -dc '0-9')
          [ "${found:-0}" = "1" ] || { echo "::error::le compte a disparu au redémarrage"; exit 1; }
          echo "Les données persistent."

      - name: Journal du conteneur en cas d'échec
        if: failure()
        run: docker logs oncc || true
