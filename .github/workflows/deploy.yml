name: Déploiement en production

on:
  workflow_call:
    inputs:
      image:
        description: Image de production référencée par empreinte
        required: true
        type: string

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: oncc-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Vérifier l'approbation de la production et la révision
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg owner "$OWNER_ID" 'any(.[]; .state == "approved" and (.user.id | tostring) == $owner and any(.environments[]; .name == "production"))' ||
            { echo "::error::Approbation de l'environnement production par le propriétaire requise."; exit 1; }

          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Cette révision a été remplacée sur main."
            exit 1
          fi

      - name: Déployer l'image validée sur le VPS
        env:
          IMAGE: ${{ inputs.image }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          expected_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$IMAGE" == "$expected_repository"@sha256:* && "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/key" -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "deploy-oncc $IMAGE"
