name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Composer deps
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Install NPM deps
        run: npm ci

      - name: Copy env
        run: cp .env.example .env

      - name: Create SQLite database file
        run: mkdir -p database && touch database/database.sqlite

      - name: Generate key & migrate
        run: |
          php artisan key:generate
          php artisan migrate --force

      - name: Compiler les assets
        # Le layout charge ses styles et scripts par @vite : si la
        # construction casse, la page ne s'affiche plus. Les tests s'en
        # affranchissent via withoutVite(), c'est donc ici que le build est
        # réellement vérifié.
        run: npm run build

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --no-coverage

      - name: Run composer audit
        run: composer audit || true

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
