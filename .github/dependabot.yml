version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    allow:
      - dependency-type: direct

  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    allow:
      - dependency-type: direct
    groups:
      vite-toolchain:
        patterns:
          - "vite"
          - "laravel-vite-plugin"
          - "@tailwindcss/vite"
          - "tailwindcss"
