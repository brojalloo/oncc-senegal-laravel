[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Chaque processus est relancé s'il meurt. Si nginx ou php-fpm échoue de façon
; répétée, supervisord le marque FATAL et cesse d'essayer : le conteneur ne
; sert alors plus rien, et c'est le HEALTHCHECK de l'image (voir Dockerfile)
; qui le signale à la plateforme, laquelle le redémarre.
;
; Une version précédente coupait le conteneur via un eventlistener dès qu'un
; processus se terminait. Incompatible avec le worker de file d'attente, qui
; sort volontairement toutes les heures (--max-time) pour libérer sa mémoire :
; chaque recyclage aurait tué le conteneur.

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Sans ce processus, les emails mis en file d'attente (vérification d'adresse,
; réinitialisation de mot de passe, infolettre) s'empileraient en base sans
; jamais partir.
;
; --max-time recycle le worker toutes les heures : un processus PHP de longue
; durée finit par retenir de la mémoire. stopwaitsecs dépasse le timeout du
; job le plus long pour qu'un arrêt laisse le travail en cours se terminer.
[program:queue-worker]
command=php /app/artisan queue:work --tries=3 --max-time=3600 --sleep=3 --backoff=10
user=www-data
autostart=true
autorestart=true
startretries=3
stopwaitsecs=630
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
