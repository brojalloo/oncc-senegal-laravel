[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Dimensionnement volontairement modeste : ces valeurs conviennent à un
; conteneur de 512 Mo. Augmentez pm.max_children si vous montez la RAM.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Les journaux partent sur la sortie standard du conteneur, là où les
; plateformes d'hébergement les collectent.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

clear_env = no
