[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_22', 'npm-9_x']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader']

[phases.build]
cmds = ['npm install', 'npm run build || true', 'php artisan config:cache', 'php artisan view:cache']

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"